<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager — Medivex</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="app-nav panel-card">
        <a class="app-nav__brand" href="index.html">
          <img src="assets/logo.png" alt="Medivex Biotech logo" />
          <div>
            <p class="eyebrow">Operations Workspace</p>
            <strong>Medivex Billing &amp; Orders</strong>
          </div>
        </a>
        <nav class="app-nav__links" aria-label="Primary">
          <a class="app-nav__link" href="index.html">Dashboard</a>
          <a class="app-nav__link" href="invoice-generator.html">Invoice Generator</a>
          <a class="app-nav__link" href="supplier-orders.html">Supplier Orders</a>
          <a class="app-nav__link app-nav__link--active" href="product-dashboard.html">Manager</a>
        </nav>
      </header>

      <div class="pdash-shell">
        <div class="pdash-header">
          <div class="pdash-header__copy">
            <p class="eyebrow">Products</p>
            <h1>Manager</h1>
            <p>Add, edit and delete products. Changes sync across the app immediately.</p>
          </div>
          <div class="pdash-header__actions">
            <button class="pdash-btn pdash-btn--ghost" id="btn-add">+ Add Product</button>
            <button class="pdash-btn pdash-btn--primary" id="btn-save">Save Changes</button>
          </div>
        </div>

        <div class="pdash-panel">
          <div class="pdash-toolbar">
            <input
              class="pdash-search"
              id="pdash-search"
              type="search"
              placeholder="Filter by product or supplier…"
              autocomplete="off"
            />
          </div>

          <div class="pdash-table-wrap">
            <table class="pdash-table">
              <thead>
                <tr>
                  <th class="pdash-th-sort" data-sort="supplier">Supplier <span class="pdash-sort-icon"></span></th>
                  <th class="pdash-th-sort" data-sort="name">Product <span class="pdash-sort-icon"></span></th>
                  <th class="pdash-th-sort" data-sort="unit_cost">Cost (Rs.) <span class="pdash-sort-icon"></span></th>
                  <th class="pdash-th-sort" data-sort="unit_price">Price (Rs.) <span class="pdash-sort-icon"></span></th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="products-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      (function () {
        var db = window.MVB_DB;
        var store = window.MVB_PRICE_STORE;

        var allProducts = [];
        var pendingUpdates = {}; // { id: { supplier, name, unit_cost, unit_price } }
        var searchQuery = '';
        var addingNew = false;
        var sortField = 'supplier';
        var sortDir = 'asc';

        var tbody = document.getElementById('products-tbody');
        var searchInput = document.getElementById('pdash-search');
        var btnSave = document.getElementById('btn-save');
        var btnAdd = document.getElementById('btn-add');

        function esc(str) {
          return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function fmt(val) {
          return val !== null && val !== undefined && val !== '' ? Number(val).toFixed(2) : '';
        }

        function get(id, field, fallback) {
          return pendingUpdates[id] && Object.prototype.hasOwnProperty.call(pendingUpdates[id], field)
            ? pendingUpdates[id][field]
            : fallback;
        }

        // ── Sort helpers ──────────────────────────────────────────

        function sortValue(p, field) {
          var v = p[field];
          return v == null ? null : v;
        }

        function sortRows(rows) {
          return rows.slice().sort(function (a, b) {
            var av = sortValue(a, sortField);
            var bv = sortValue(b, sortField);
            // Nulls always last
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            var cmp = typeof av === 'number'
              ? av - bv
              : String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
            return sortDir === 'asc' ? cmp : -cmp;
          });
        }

        function updateHeaders() {
          document.querySelectorAll('.pdash-th-sort').forEach(function (th) {
            var active = th.dataset.sort === sortField;
            th.classList.toggle('pdash-th-sort--active', active);
            th.querySelector('.pdash-sort-icon').textContent = active
              ? (sortDir === 'asc' ? ' ↑' : ' ↓')
              : '';
          });
        }

        // ── Render ────────────────────────────────────────────────

        function render() {
          var q = searchQuery.toLowerCase();
          var filtered = sortRows(allProducts.filter(function (p) {
            return (
              !q ||
              (p.name && p.name.toLowerCase().indexOf(q) !== -1) ||
              (p.supplier && p.supplier.toLowerCase().indexOf(q) !== -1)
            );
          }));

          var html = '';

          if (addingNew) {
            html +=
              '<tr class="pdash-new-row" id="new-product-row">' +
              '<td><input class="pdash-cell-input" id="new-supplier" type="text" placeholder="Supplier (optional)" autocomplete="off"></td>' +
              '<td><input class="pdash-cell-input" id="new-name" type="text" placeholder="Product name *" autocomplete="off"></td>' +
              '<td><input class="pdash-cell-input pdash-cell-input--num" id="new-cost" type="number" min="0" step="0.01" placeholder="—"></td>' +
              '<td><input class="pdash-cell-input pdash-cell-input--num" id="new-price" type="number" min="0" step="0.01" placeholder="—"></td>' +
              '<td><div class="pdash-row-actions">' +
              '<button class="pdash-add-confirm-btn" id="confirm-add">Add</button>' +
              '<button class="pdash-cancel-add-btn" id="cancel-add">&#x2715;</button>' +
              '</div></td>' +
              '</tr>';
          }

          for (var i = 0; i < filtered.length; i++) {
            var p = filtered[i];
            var dirty = !!pendingUpdates[p.id];
            var supplier = get(p.id, 'supplier', p.supplier);
            var name = get(p.id, 'name', p.name);
            var cost = get(p.id, 'unit_cost', p.unit_cost);
            var price = get(p.id, 'unit_price', p.unit_price);

            html +=
              '<tr class="' + (dirty ? 'is-modified' : '') + '" data-id="' + p.id + '">' +
              '<td><input class="pdash-cell-input" type="text" value="' + esc(supplier) + '" data-field="supplier" placeholder="—" autocomplete="off"></td>' +
              '<td><input class="pdash-cell-input" type="text" value="' + esc(name) + '" data-field="name" placeholder="Product name" autocomplete="off"></td>' +
              '<td><input class="pdash-cell-input pdash-cell-input--num" type="number" min="0" step="0.01" value="' + fmt(cost) + '" data-field="unit_cost" placeholder="—"></td>' +
              '<td><input class="pdash-cell-input pdash-cell-input--num" type="number" min="0" step="0.01" value="' + fmt(price) + '" data-field="unit_price" placeholder="—"></td>' +
              '<td><button class="pdash-delete-btn" data-id="' + p.id + '" title="Delete">&#x2715;</button></td>' +
              '</tr>';
          }

          if (!addingNew && filtered.length === 0) {
            html = '<tr><td colspan="5" class="pdash-empty">No products found.</td></tr>';
          }

          tbody.innerHTML = html;
          attachListeners();
        }

        // ── Listeners ─────────────────────────────────────────────

        function attachListeners() {
          tbody.querySelectorAll('[data-field]').forEach(function (input) {
            input.addEventListener('input', onCellInput);
          });

          tbody.querySelectorAll('.pdash-delete-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              deleteProduct(parseInt(this.dataset.id));
            });
          });

          var confirmBtn = document.getElementById('confirm-add');
          var cancelBtn = document.getElementById('cancel-add');
          if (confirmBtn) confirmBtn.addEventListener('click', confirmAdd);
          if (cancelBtn) cancelBtn.addEventListener('click', cancelAdd);

          var newRow = document.getElementById('new-product-row');
          if (newRow) {
            newRow.querySelectorAll('input').forEach(function (input) {
              input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') confirmAdd();
                if (e.key === 'Escape') cancelAdd();
              });
            });
            var nameInput = document.getElementById('new-name');
            if (nameInput) setTimeout(function () { nameInput.focus(); }, 0);
          }
        }

        function onCellInput() {
          var row = this.closest('tr');
          var id = parseInt(row.dataset.id);
          var field = this.dataset.field;

          if (!pendingUpdates[id]) {
            var p = allProducts.find(function (p) { return p.id === id; });
            pendingUpdates[id] = {
              supplier: p.supplier,
              name: p.name,
              unit_cost: p.unit_cost,
              unit_price: p.unit_price,
            };
          }

          pendingUpdates[id][field] = this.type === 'number'
            ? (this.value === '' ? null : parseFloat(this.value))
            : this.value;

          row.classList.add('is-modified');
        }

        // ── Add ───────────────────────────────────────────────────

        function cancelAdd() {
          addingNew = false;
          render();
        }

        async function confirmAdd() {
          var nameInput = document.getElementById('new-name');
          if (!nameInput) return;
          var name = nameInput.value.trim();
          if (!name) { nameInput.focus(); return; }

          var supplier = (document.getElementById('new-supplier').value || '').trim() || null;
          var costVal = document.getElementById('new-cost').value;
          var priceVal = document.getElementById('new-price').value;

          var result = await db.from('products').insert([{
            supplier: supplier,
            name: name,
            unit_cost: costVal ? parseFloat(costVal) : null,
            unit_price: priceVal ? parseFloat(priceVal) : null,
          }]).select();

          if (result.error) { alert('Failed to add product. Please try again.'); return; }

          allProducts.unshift(result.data[0]);
          addingNew = false;
          render();
        }

        // ── Delete ────────────────────────────────────────────────

        async function deleteProduct(id) {
          if (!confirm('Delete this product? This cannot be undone.')) return;

          var result = await db.from('products').delete().eq('id', id);
          if (result.error) { alert('Failed to delete. Please try again.'); return; }

          allProducts = allProducts.filter(function (p) { return p.id !== id; });
          delete pendingUpdates[id];
          render();
        }

        // ── Save ──────────────────────────────────────────────────

        async function save() {
          var ids = Object.keys(pendingUpdates);
          if (!ids.length) return;

          btnSave.disabled = true;
          btnSave.textContent = 'Saving…';

          var results = await Promise.all(
            ids.map(function (id) {
              return db.from('products')
                .update(Object.assign({}, pendingUpdates[parseInt(id)], { updated_at: new Date().toISOString() }))
                .eq('id', parseInt(id));
            })
          );

          var hasError = results.some(function (r) { return r && r.error; });

          if (!hasError) {
            ids.forEach(function (id) {
              var idx = allProducts.findIndex(function (p) { return p.id === parseInt(id); });
              if (idx !== -1) Object.assign(allProducts[idx], pendingUpdates[parseInt(id)]);
            });
            pendingUpdates = {};
          }

          btnSave.disabled = false;
          btnSave.textContent = hasError ? 'Error — try again' : 'Saved!';
          btnSave.classList.toggle('pdash-btn--saved', !hasError);
          setTimeout(function () {
            btnSave.textContent = 'Save Changes';
            btnSave.classList.remove('pdash-btn--saved');
            if (!hasError) render();
          }, 1500);
        }

        // ── Toolbar events ────────────────────────────────────────

        document.querySelectorAll('.pdash-th-sort').forEach(function (th) {
          th.addEventListener('click', function () {
            var field = this.dataset.sort;
            if (sortField === field) {
              sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
              sortField = field;
              sortDir = 'asc';
            }
            updateHeaders();
            render();
          });
        });

        searchInput.addEventListener('input', function () {
          searchQuery = this.value;
          render();
        });

        btnSave.addEventListener('click', save);

        btnAdd.addEventListener('click', function () {
          addingNew = true;
          render();
          tbody.closest('.pdash-table-wrap').scrollTop = 0;
        });

        // ── Init ──────────────────────────────────────────────────

        tbody.innerHTML = '<tr><td colspan="5" class="pdash-empty">Loading…</td></tr>';

        store.initProducts().finally(function () {
          db.from('products')
            .select('*')
            .order('supplier', { nullsFirst: false })
            .order('name')
            .then(function (result) {
              if (result.error || !result.data) {
                tbody.innerHTML = '<tr><td colspan="5" class="pdash-empty">Failed to load. Please refresh.</td></tr>';
                return;
              }
              allProducts = result.data;
              updateHeaders();
              render();
            });
        });
      })();
    </script>
  </body>
</html>
